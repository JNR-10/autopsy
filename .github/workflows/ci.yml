name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core only (smoke)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Core import smoke
        run: |
          python -c "from autopsy import lens, load_config; assert load_config().capture.default_sample == 'errors'"

      - name: Install full dev stack
        run: pip install -e ".[dev,server,diagnose]"

      - name: Ruff
        run: ruff check autopsy tests

      - name: Pytest
        run: python -m pytest tests/ -q

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,diagnose]"
      - name: Slow tests (detector perf, crash recovery)
        run: python -m pytest tests/ -q -m slow
